<h1>Sign Up</h1>

{% if messages %}
{% for message in messages %}
<p>{{ message }}</p>
{% endfor %}
{% endif %}

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Create account</button>
</form>

<p><a href="{% url 'login' %}">Already have an account? Login</a></p>
