<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            background-color: rgb(217, 216, 216);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        input {
            margin: 10px;
            font-size: 30px;
            border-radius: 10px;
            border-width: 0px 0px 3px 0px;
            box-shadow: 2px 2px 3px 2px rgba(0, 0, 0, 0.086);
        }

        button {
            text-align: center;
            font-size: 30px;
            color: white;
            background-color: black;
            border-radius: 20px;
            transition: 0.2s;
        }

        button:hover {
            transition: 0.5s;
            box-shadow: 10px 10px 1px red;
        }

        button:active {
            transition: 0.1s;
            background-color: rgb(235, 233, 233);
            color: black;
        }

        label {
            font-size: 30px;
        }

        input:required {
            border-color: crimson;
        }

        input:optional {
            border-color: green;
        }

        input:invalid {
            color: red;
        }

        input:focus {
            box-shadow: 5px 5px 5px rgba(8, 19, 224, 0.086);

        }
        input:read-only{
            background-color: rgba(128, 128, 128, 0.366);
        }
    </style>
</head>

<body>

    <form action="POST">

        <table>
            <tr>
                <td>
                    <label for="college">College:</label>
                </td>

                <td>
                    <input type="text" id="college" value="GLA University" readonly>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="firstname">First Name:</label>
                </td>

                <td>
                    <input type="text" id="firstname" required>
                </td>
            </tr>


            <tr>
                <td>
                    <label for="middlename">Middle Name:</label>
                </td>

                <td>
                    <input type="text" id="middlename">
                </td>
            </tr>


            <tr>
                <td>
                    <label for="lastname">Last Name:</label>
                </td>

                <td>
                    <input type="text" id="lastname" required>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="Email">Email:</label>
                </td>

                <td>
                    <input type="email" id="lastname" required>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="Age">Age:</label>
                </td>

                <td>
                    <input type="number" id="AGE" required>
                </td>
            </tr>
            <tr>
                <td>

                </td>


                <td>

                </td>
            </tr>
            <tr>
                <td>

                </td>


                <td>
                    <button>Daba Do Isko</button>
                </td>
            </tr>

        </table>

    </form>

</body>

</html>
