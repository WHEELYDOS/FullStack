<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root {
            --primary-color : #0166B1  ; 
            /* -- is used to define the variable  */
            --secondary-color : #FFFFFF ; 
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgb(255, 255, 255);
        } 

        .container {

            display: grid;
            outline: 60px solid black;
            height: 500px;
            width: 500px;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            border-radius: 50%;
            
            overflow: hidden;
            
        }

        .container>div {

        }

        #box1 {
            background-color: var(--primary-color);
            grid-column: 1/3;
            grid-row: 1/3;
        }

        #box2 {
            background-color: var(--secondary-color);
            grid-column: 2/3;
            grid-row: 1/2;

        }

        #box3 {
            background-color: var(--secondary-color);

            grid-row: 2/3;
            grid-column: 1/2;
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="box1"></div>
        <div id="box2"></div>
        <div id="box3"></div>




    </div>

</body>

</html>
