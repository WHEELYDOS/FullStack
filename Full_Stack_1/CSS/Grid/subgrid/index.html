<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root{
            --size : 300px;
        }
        .container{
            display: grid;
            outline: 1px solid black;
            height: 500px;
            width: 500px;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
        }
        .container>div{
            outline: 3px solid rgb(150, 12, 127);
        }
        #box1{
            background-color: aquamarine;
            grid-column:1/3;
            grid-row:1/3;
        }
        #box2{
            background-color: red;
            grid-column:2/3;
            grid-row:1/2;
        }
        #box3{
            background-color: greenyellow;
        }
        #box4{
            background-color: yellow;
        }
        #box5{
            background-color: chocolate;
                        
            grid-row:2/3;
            grid-column:1/2;
        }
        #box6{
            background-color: pink;
            grid-row-start:3 ; /* width x1 */
            grid-row-end: 4; /* width x2 */
            grid-column-start:1 ; /* width y1 */
            grid-column-end: 3; /* width y2 */

        }
        h1{
           font-size: calc(var(--size) / 2);
        }
        

    </style>
</head>
<body>
    <div class="container">
        <div id = "box1">1</div>
        <div id = "box2">2</div>
        <div id = "box3">3</div>
        <div id = "box4">4</div>
        <div id = "box5">5</div>
        <div id = "box6">6</div>

        

    </div>

    <h1>TEXT</h1>


</body>
</html>
