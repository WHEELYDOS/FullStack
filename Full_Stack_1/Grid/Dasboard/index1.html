<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dynamic CSS Grid</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            display: grid;

            gap: 10px;
            grid-template-columns: repeat(3, minmax(200px, 1fr));

            grid-auto-rows: 150px;
        }

        .container>div {
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            border: 1px solid black;
            border-radius: 8px;

            font-size: 24px;
        }

        .box1 {
            background: rgb(77, 107, 141);

            grid-column: span 3;
        }

        .box2 {
            background: rgb(77, 141, 87);


            grid-column: span 1;
            grid-row: span 3;
        }

        .box3 {
            background: rgb(141, 129, 77);


            grid-column: span 2;
            grid-row: span 2;
        }

        .box4 {
            background: rgb(130, 77, 141);
            grid-column: span 1;
        }

        .box5 {
            background: rgb(141, 77, 77);
            grid-column: span 1;

        }

        .box6 {
            background: rgb(128, 128, 128);


            grid-column: span 3;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="box1">
            <h1>1</h1>
        </div>

        <div class="box2">
            <h1>2</h1>
        </div>

        <div class="box3">
            <h1>3</h1>
        </div>

        <div class="box4">
            <h1>4</h1>
        </div>

        <div class="box5">
            <h1>5</h1>
        </div>

        <div class="box6">
            <h1>6</h1>
        </div>

    </div>

</body>

</html>
