<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid rev</title>

    <style>
        .container1{
            height:50vh;
            display: grid;
            grid-template-columns:repeat(auto-fit,minmax(150px, 1fr));
            grid-template-rows:;
            gap: 15px;
        }
        .container1>div{
            outline: 1px solid black;
        }
        .container2{
            height:50vh;
            display: grid;
            grid-template-columns:repeat(auto-fill,minmax(150px, 1fr));
            grid-template-rows:;
            gap: 15px;
        }
        .container2>div{
            outline: 1px solid black;
        }
    </style>

</head>
<body>
    <div class="container1">
        <div id="box1">1</div>
        <div id="box2">2</div>
        <div id="box3">3</div>
        <div id="box4">4</div>
    </div>
    <div class="container2">
        <div id="box1">1</div>
        <div id="box2">2</div>
        <div id="box3">3</div>
        <div id="box4">4</div>
    </div>
</body>
</html>
