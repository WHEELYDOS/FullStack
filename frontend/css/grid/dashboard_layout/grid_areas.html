<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Areas Dashboard</title>
    <style>
               body{
            height: 98vh;
            width: 98vw;

        }
        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(5, 150px);
            gap: 10px;

            grid-template-areas:
                "box1 box1 box1"
                "box2 box3 box3"
                "box2 box3 box3"
                "box2 box4 box5"
                "box6 box6 box6"
            ;
        }

        .container>div {
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            border-radius: 8px;
            border: 1px solid black;
            width: 100%;
        }

        .box1 {
            background: rgb(77, 107, 141);
            grid-area: box1;
        }

        .box2 {
            background: rgb(77, 141, 87);

            grid-area: box2;
        }

        .box3 {
            background: rgb(141, 129, 77);

            grid-area: box3;
        }

        .box4 {
            background: rgb(130, 77, 141);

            grid-area: box4;
        }

        .box5 {
            background: rgb(141, 77, 77);
            grid-area: box5;
        }

        .box6 {
            background: rgb(128, 128, 128);

            grid-area: box6;
        }

        .box7 {
            grid-area: box7;
        }

        .box8 {
            grid-area: box8;
        }

        .box9 {
            grid-area: box9;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box1">
            <h1>1</h1>
        </div>
        <div class="box2">
            <h1>2</h1>
        </div>
        <div class="box3">
            <h1>3</h1>
        </div>
        <div class="box4">
            <h1>4</h1>
        </div>
        <div class="box5">
            <h1>5</h1>
        </div>
        <div class="box6">
            <h1>6</h1>
        </div>
    </div>
</body>

</html>
